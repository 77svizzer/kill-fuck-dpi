# ===================================================================
#             KILL F#CK DPI - Конфигурационный файл
# ===================================================================
# Легковесная локальная утилита обхода блокировок DPI на базе WinDivert.
# Все изменения применяются при перезапуске утилиты.

[General]
# Позиция разделения (в байтах) для фрагментации TLS ClientHello.
# -------------------------------------------------------------------
# Рекомендуемые значения:
#   2 - Стандартный режим (разрезает заголовок на 2 байта + остаток).
#       Максимально совместим с веб-серверами и защищен от фильтрации SNI.
#   1 - Агрессивный режим (разрезает на 1 байт + остаток).
#       Используется против жестких эвристик ТСПУ и DPI-фильтрации.
split_position = 2

# Целевые TCP порты для перехвата (через запятую).
# -------------------------------------------------------------------
# WinDivert перехватывает трафик ТОЛЬКО на указанные в этом списке порты.
# Порт 80  : HTTP (не-TLS трафик пропускается без задержек)
# Порт 443 : HTTPS / TLS (фрагментируется только ClientHello)
target_ports = 80, 443

# Аппаратная изоляция игрового UDP трафика (FACEIT, CS2, Steam, Discord Voice).
# -------------------------------------------------------------------
# Значение true означает, что UDP трафик полностью исключен из фильтра
# сетевого драйвера на уровне Windows Filtering Platform (WFP).
# Игровые пакеты Counter-Strike 2 (UDP порты 27015-27050), кастомные
# серверы FACEIT EU, драйвер FACEIT Anti-Cheat и голосовой трафик Discord
# передаются ОС напрямую на сетевую карту с нулевым оверхедом и без задержек.
isolate_game_udp = true
