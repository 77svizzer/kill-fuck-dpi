# ===================================================================
#             KILL F#CK DPI - Конфигурационный файл
# ===================================================================
# Полностью автономная C++ утилита обхода DPI на базе WinDivert.
# Без сторонних зависимостей, winws и zapret.

[General]
# Позиция разделения TLS ClientHello (в байтах).
# По умолчанию: 2 (разрезает заголовок ClientHello на 2 байта + тело).
split_position = 2

# Инверсия порядка передачи TCP сегментов (Disorder / Reverse split).
# При значении true Segment 2 (содержащий имя хоста SNI) отправляется ПЕРВЫМ,
# а Segment 1 (заголовок TLS) отправляется ВТОРЫМ.
# Это обходит 99% ТСПУ и DPI-фильтров, не ломая Cloudflare и Xplay!
disorder = true

# Сброс исходящего QUIC на порту UDP 443.
# При значении true браузеры (Chrome, Edge) мгновенно переходят с заблокированного
# протокола QUIC на скоростной протокол TCP HTTP/2 с TLS-десинхронизацией.
# Гарантирует воспроизведение YouTube в 1080p, 2K и 4K без буферизации.
drop_quic = true

# Целевые TCP порты для перехвата (через запятую).
target_ports = 80, 443
