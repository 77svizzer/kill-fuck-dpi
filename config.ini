# ===================================================================
#             KILL F#CK DPI - Конфигурационный файл
# ===================================================================
# Полностью автономная C++ утилита обхода DPI на базе WinDivert.
# Без сторонних зависимостей, winws и zapret.

[General]
# Стратегия десинхронизации:
# fake_split2   - фейковый пакет (badsum/autottl) + реальный Seg1 + реальный Seg2 (РЕКОМЕНДУЕТСЯ)
# fake_disorder - фейковый пакет + реальный Seg2 (первым) + реальный Seg1 (вторым)
# split2        - разделение на 2 сегмента по порядку (Seg1 затем Seg2)
# disorder      - разделение на 2 сегмента в обратном порядке (Seg2 затем Seg1)
strategy = fake_split2

# Позиция разделения пакета:
# midsld - разделение точно посередине домена 2-го уровня (напр. "goog" + "levideo.com")
# sni    - разделение по началу имени сервера SNI
# 2      - классическое разделение на 2 байта (устаревший режим)
split_position = midsld

# Методы обмана ТСПУ (Fooling):
# badsum,autottl - комбинация поврежденной TCP checksum и малого TTL (РЕКОМЕНДУЕТСЯ)
# badsum         - поврежденная контрольная сумма TCP: ТСПУ сглатывает, сервер отбрасывает
# autottl        - малый TTL: пакет доходит до ТСПУ провайдера, но умирает до сервера
# none           - без искажения заголовков
fooling = badsum,autottl

# Значение TTL для фейковых пакетов (рекомендуется 5-8 хопов)
fake_ttl = 6

# Сброс исходящего QUIC на порту UDP 443 (YouTube 4K мгновенно переходит на HTTP/2)
drop_quic = true

# Обход блокировки голосовых каналов Discord (UDP порты 50000-65535)
discord_voice_fake = true

# Использование списков из папки lists/ (точечная десинхронизация заблокированных сайтов)
use_hostlists = true

# Целевые TCP порты для перехвата
target_ports = 80, 443
